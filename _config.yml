# Site settings
title: "manjushsh"
description: "A collection of thoughts, tutorials, and insights on software development"
author: "manjushsh"
email: "dpbzbpj6v@mozmail.com"
url: "https://manjushsh.github.io"
baseurl: "/manjushsh"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Permalink structure for posts
permalink: /blog/:year/:month/:day/:title/

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false

# Collections
collections:
  posts:
    output: true
  projects:
    output: true
    permalink: /:collection/:name/
  external_posts:
    output: false

# Pagination (disabled for now to avoid issues)
# paginate: 10
# paginate_path: "/blog/page:num/"

# Social links
social_links:
  github: manjushsh
  dev_to: manjushsh
  email: dpbzbpj6v@mozmail.com

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "external_posts"
    values:
      layout: "post"
      external: true
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/